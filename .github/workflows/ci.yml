# テスト（PR と main へのプッシュ）。公開・PR のプレビュー・リリースは pages.yml が
# このワークフローの完了を受けて行う（テストが通った回だけ）。
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# PR は新しいプッシュで古い実行を止める。main は公開を途中で止めないよう打ち切らない
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: Version check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # src/version.js・package.json・CHANGELOG.md のバージョンがそろっているか
      - run: node tools/check-version.mjs

  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # 画面を使わない計算（曲の解析・曲に合わせたテンポ・AAC の設定情報など）。数秒で終わる
      - run: npm run test:unit

  e2e:
    # 一般配布の Google Chrome で、テストを 2 つに分けて同時に走らせる（待ち時間を約半分に）。
    # H.264 が使えないブラウザの経路（VP9 で書き出す）は、テストの中で H.264 を外して確かめる
    name: E2E (${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      E2E_SHARD: ${{ matrix.shard }}
      EXPECT_H264: 1
      # 比率違いの見本シート（目で見るための画像）は、Actions の画面から手で動かしたときだけ作る
      E2E_ASPECT_SHEETS: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Use Google Chrome (stable)
        run: |
          google-chrome --version
          echo "CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - run: npm run test:e2e
      - name: Upload screenshots and exported videos
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-output-${{ matrix.shard }}
          path: tests/output/
          retention-days: 7
          if-no-files-found: ignore
