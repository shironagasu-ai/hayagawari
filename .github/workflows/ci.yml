# テスト（PR と main へのプッシュ）。公開・PR のプレビュー・リリースは pages.yml が
# このワークフローの完了を受けて行う（テストが通った回だけ）。
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# PR は新しいプッシュで古い実行を止める。main は公開を途中で止めないよう打ち切らない
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: Version check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # src/version.js・package.json・CHANGELOG.md のバージョンがそろっているか
      - run: node tools/check-version.mjs

  e2e:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # chromium: Playwright の Chromium（H.264 / AAC エンコーダなし → VP9 / Opus で書き出し）
        # chrome:   一般配布の Google Chrome（H.264 で書き出せることも確認）
        browser: [chromium, chrome]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        if: matrix.browser == 'chromium'
        run: npx playwright-core install --with-deps chromium
      - name: Use Google Chrome (stable)
        if: matrix.browser == 'chrome'
        run: |
          google-chrome --version
          echo "CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          echo "EXPECT_H264=1" >> "$GITHUB_ENV"
      - run: npm test
      - name: Upload screenshots and exported videos
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-output-${{ matrix.browser }}
          path: tests/output/
          retention-days: 7
          if-no-files-found: ignore
